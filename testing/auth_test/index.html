<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>auth_test</title>
  </head>
  <body>
    <div id="app">
      <div id="left">
        <h2 id="welcome-msg">Welcome to the auth test</h2>
        <div id="loginBtn">
          <img src="/google.png" alt="google logo">
          <p>Continue with Google</p>
        </div>
        <div id="logoutBtn">
          <p>Logout</p>
        </div>
      </div>
      <div id="right">
        <h1>Result (see console for detailed session values):</h1>
        <br>
        <div id="copy-session">
          Copy Session Token
        </div>
        <br>
        <p id="result">. . .</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
